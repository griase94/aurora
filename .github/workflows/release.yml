# Every merge to main that changes a package releases a version, without a
# human step. The merged pull request's label sets the level
# (aurora:major|minor|patch; aurora:skip and changes outside packages/ release
# nothing). The version, `private: false` and the repository field are set in
# the runner only and never committed back to main.
#
# Re-running for a commit that already carries a v* tag is a no-op.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the tag and the GitHub release
      pull-requests: read # read the merged pull requests and their labels
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    outputs:
      version: ${{ steps.plan.outputs.release == 'true' && steps.plan.outputs.version || '' }}
      tag: ${{ steps.plan.outputs.release == 'true' && steps.plan.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Plan (merged pull requests, label, next version)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          ALLOW_1_0: ${{ vars.AURORA_ALLOW_1_0 }}
        run: |
          node scripts/release.mjs prs --head "$HEAD_SHA" --repo "$REPO" --out "$RUNNER_TEMP/prs.json"
          allow=()
          if [ "$ALLOW_1_0" = "true" ]; then allow=(--allow-1.0); fi
          node scripts/release.mjs plan --head "$HEAD_SHA" --prs "$RUNNER_TEMP/prs.json" "${allow[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.plan.outputs.release != 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          echo "No release: $REASON" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install
        if: steps.plan.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Set the version in the runner
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: node scripts/release.mjs apply --version "$VERSION" --repository "$REPO"

      - name: Build, pack, publint, attw
        if: steps.plan.outputs.release == 'true'
        run: pnpm aurora:pack --out "$RUNNER_TEMP/assets"

      - name: Checksums and notes
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/release.mjs sums --dir "$RUNNER_TEMP/assets"
          node scripts/release.mjs notes --version "$VERSION" --prs "$RUNNER_TEMP/prs.json" --repository "$REPO" --out "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/assets/SHA256SUMS"

      - name: Consumer smoke on the release tarballs
        if: steps.plan.outputs.release == 'true'
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/assets"

      - name: Provenance attestation
        if: steps.plan.outputs.release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/*.tgz

      - name: GitHub release (creates the tag on this commit)
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --target "$HEAD_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}" \
            "$RUNNER_TEMP"/assets/*.tgz "$RUNNER_TEMP/assets/SHA256SUMS"
          echo "Released [$TAG](https://github.com/$REPO/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tarballs for the npm job
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/assets/*.tgz
          retention-days: 7
          if-no-files-found: error

  # Off until the npm scope exists: set the repository variable NPM_PUBLISH to
  # "true" and the secret NPM_TOKEN (switch to npm trusted publishing after the
  # first publish and delete the token).
  npm:
    name: npm publish
    needs: release
    if: needs.release.outputs.version != '' && vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarballs
          path: tarballs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for f in tarballs/*.tgz; do
            npm publish "$f" --provenance --access public
          done

  # Tells consumer repos about a release (repository_dispatch, event
  # `aurora-released`). Off until the secret CONSUMERS_TOKEN exists. The list
  # of consumers is the repository variable AURORA_CONSUMERS (owner/repo,
  # separated by spaces or new lines), never a tracked file: this repo is
  # public and must not name private repos.
  dispatch:
    name: tell consumers
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      HAS_TOKEN: ${{ secrets.CONSUMERS_TOKEN != '' }}
    steps:
      - name: No token
        if: env.HAS_TOKEN != 'true'
        run: echo "No CONSUMERS_TOKEN secret, so no consumer is told."
      - name: Dispatch aurora-released
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONSUMERS_TOKEN }}
          CONSUMERS: ${{ vars.AURORA_CONSUMERS }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for repo in $CONSUMERS; do
            if ! [[ "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::warning::skipping '$repo': not owner/repo"
              continue
            fi
            gh api "repos/$repo/dispatches" -f event_type=aurora-released -f "client_payload[version]=$VERSION"
            echo "told $repo"
          done
