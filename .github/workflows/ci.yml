# Pull request checks. `ci-ok` is the one required check: green means every
# job that ran passed (a skipped job is fine).
#
# Public-repo safety: `pull_request` only (never `pull_request_target`), a
# read-only token, no secrets, every action pinned by commit SHA, and pull
# request text (title, body, branch, labels) reaches a script only through
# `env:`, never spliced into a shell line.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
      examples: ${{ steps.diff.outputs.examples }}
      docs: ${{ steps.diff.outputs.docs }}
      foundations: ${{ steps.diff.outputs.foundations }}
      tooling: ${{ steps.diff.outputs.tooling }}
      workflows: ${{ steps.diff.outputs.workflows }}
      release: ${{ steps.diff.outputs.release }}
      has_docs: ${{ steps.diff.outputs.has_docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Paths this pull request touches
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          printf '%s\n' "$files"
          touches() { if grep -qE "$1" <<<"$files"; then echo true; else echo false; fi; }
          {
            echo "packages=$(touches '^packages/')"
            echo "examples=$(touches '^examples/')"
            echo "docs=$(touches '^apps/docs/')"
            echo "foundations=$(touches '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|\.nvmrc)$')"
            echo "tooling=$(touches '^(scripts/|\.github/)')"
            echo "workflows=$(touches '^\.github/(workflows|actions)/')"
            echo "release=$(touches '^(\.github/workflows/release(-build)?\.yml|scripts/(release|pack|consumer-smoke)\.mjs|scripts/(lib|consumer)/|\.github/workflows/ci\.yml|\.github/actions/)')"
            if [ -f apps/docs/package.json ]; then echo "has_docs=true"; else echo "has_docs=false"; fi
          } | tee -a "$GITHUB_OUTPUT"

  static:
    name: static
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The label rule reads the v* tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - name: actionlint
        if: needs.changes.outputs.workflows == 'true'
        # Go verifies the module against the checksum database, so the
        # version tag pins the bytes.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Label rule
        if: ${{ !cancelled() }}
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PACKAGES_CHANGED: ${{ needs.changes.outputs.packages }}
          ALLOW_1_0: ${{ vars.AURORA_ALLOW_1_0 }}
        run: node scripts/ci/label-rule.mjs

  # Runs the whole fast lane, scripts/check-scope.test.ts (`pnpm scope:check`)
  # included.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fast

  pack:
    name: pack
    needs: changes
    if: >-
      needs.changes.outputs.packages == 'true' ||
      needs.changes.outputs.examples == 'true' ||
      needs.changes.outputs.foundations == 'true' ||
      needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, pack, publint, attw
        run: pnpm aurora:pack --out "$RUNNER_TEMP/packed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/packed/*.tgz
          retention-days: 7
          if-no-files-found: error
      - name: Consumer smoke (install the tarballs in a fresh project and import them)
        run: node scripts/consumer-smoke.mjs "$RUNNER_TEMP/packed"

  # The release workflow's build half (plan, version, pack, checksums, notes,
  # consumer smoke) against a synthetic labelled pull request, whenever the
  # release path changes. Nothing is tagged, attested or published.
  release-dry-run:
    name: release dry run
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry_run: true

  # The same workflow on the path of a push that plans no release (most merges
  # of docs and tooling): the plan must say "no release" and the job must end
  # green with the install, build and pack skipped.
  release-dry-run-no-release:
    name: release dry run, no release
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry_run: true
      dry_run_no_release: true

  # Slots the kit import fills. They stay off until apps/docs exists; once it
  # does, each fails until its real body replaces the placeholder, so no slot
  # can pass by accident.
  kit:
    name: kit
    needs: changes
    if: needs.changes.outputs.has_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Placeholder
        run: |
          echo "::error title=kit::TODO: the kit import fills this job (affected kit tests; all shards when foundations change)."
          exit 1

  atlas:
    name: atlas
    needs: changes
    if: needs.changes.outputs.has_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Placeholder
        run: |
          echo "::error title=atlas::TODO: the kit import fills this job (showcase build and the Atlas specs)."
          exit 1

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.has_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Placeholder
        run: |
          echo "::error title=site::TODO: the kit import fills this job (the documentation site build with its budgets)."
          exit 1

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      [
        changes,
        static,
        unit,
        pack,
        release-dry-run,
        release-dry-run-no-release,
        kit,
        atlas,
        site,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          bad="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error title=ci-ok::failed or cancelled: $bad"
            exit 1
          fi
