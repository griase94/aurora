name: Bug
description: Something in Aurora does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Everything here is public: leave out secrets, private names and private links.
  - type: input
    id: version
    attributes:
      label: Aurora version
      description: The release you use (for example 0.1.0), or the commit.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component or package
      placeholder: e.g. Button, DatePicker, tokens
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or an Atlas specimen link helps most.
      render: svelte
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser, device, viewport, theme
      placeholder: e.g. Safari 18 on iPhone, 390 px, Dark, VoiceOver on
  - type: dropdown
    id: area
    attributes:
      label: Kind
      options:
        - Behaviour or logic
        - Accessibility (keyboard, screen reader, contrast, motion)
        - Layout at some width
        - Visual or theme
        - Types or packaging
        - Docs
    validations:
      required: true
